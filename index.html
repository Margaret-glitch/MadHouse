    <script>
        function payWithPaystack(userEmail, amountInKobo, successCallback, closeCallback) {
            const paystackPublicKey = 'pk_test_a25c13f990472e399589d81d2dfdd204caebec47';

            let handler = PaystackPop.setup({
                key: paystackPublicKey,
                email: userEmail || 'customer@email.com',
                amount: amountInKobo || 95000,
                currency: 'NGN',
                ref: 'MH_' + Math.floor((Math.random() * 1000000000) + 1),
                onClose: function() {
                    if (typeof closeCallback === 'function') {
                        closeCallback();
                    }
                },
                callback: function(response) {
                    if (typeof successCallback === 'function') {
                        successCallback(response);
                    }
                }
            });

            handler.openIframe();
        }
